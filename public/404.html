<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Starflux</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <style>
        :root {
            --bg: #0b0e1a; --surface: #141a33; --border: #232b4d;
            --text: #cbd5f5; --text-muted: #8b93b8; --heading: #f3f5ff; --accent: #f6c915;
            --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--font); background: var(--bg); color: var(--text);
            min-height: 100vh; display: flex; flex-direction: column;
            align-items: center; justify-content: center; padding: 2rem;
        }
        .code { font-size: 3rem; font-weight: 800; color: var(--accent); margin-bottom: 0.5rem; }
        h1 { font-size: 1.4rem; font-weight: 700; color: var(--heading); margin-bottom: 0.5rem; }
        p { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 2rem; max-width: 380px; text-align: center; }
        a {
            font-family: var(--font); font-size: 0.875rem; font-weight: 600;
            padding: 0.5rem 1.25rem; border-radius: 8px; text-decoration: none;
            background: var(--accent); color: #14110a;
        }
    </style>
</head>
<body>
    <div class="code">404</div>
    <h1>Page not found</h1>
    <p>The page you're looking for doesn't exist or has been moved.</p>
    <a href="/">Back to Starflux</a>
</body>
</html>
