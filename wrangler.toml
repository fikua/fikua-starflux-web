# Cloudflare Workers (Static Assets) configuration.
# Pure-static site under https://starflux.fikua.com/. No Worker code,
# no backend proxy. Cloudflare serves the files in `directory` directly
# from its global edge cache. Same pattern as fikua-lab-landing.
#
# `directory` points at `dist/`, generated by `npm run build` (build.js)
# from `content/*.json` + `templates/` + `assets/` + `public/` — the site
# is localized (en/es/ca/fr), so the deploy step needs the build to run
# first. Cloudflare's Git integration is configured with build command
# `npm run build` and deploy command `npx wrangler deploy`.

name = "fikua-starflux-web"
compatibility_date = "2026-09-13"

routes = [
    { pattern = "starflux.fikua.com", custom_domain = true }
]

[assets]
directory = "./dist"
not_found_handling = "404-page"
